<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Triagle</title>
<script nonce="{{ csp_nonce() }}">try{var t=localStorage.getItem('triagle-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="/static/triagle.css">
<style>
  .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .signin form { width: 100%; max-width: 360px; display: grid; gap: 10px; }
  .signin .brand { padding: 0 0 6px; }
  .signin p { color: var(--text-2); margin-bottom: 8px; }
  .signin input { width: 100%; height: 38px; }
  .signin .btn { height: 38px; justify-content: center; margin-top: 6px; }
  .signin a.btn { text-decoration: none; display: flex; align-items: center; }
  .signin .or { text-align: center; margin: 8px 0 0; font-size: .9rem; }
</style>
</head>
<body>
<main class="signin">
  <form method="post" action="/login" autocomplete="on">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><b>Triagle</b></div>
    <p>Sign in to the console.</p>
    {% if error %}<div class="callout bad" role="alert">{{ error }}</div>{% endif %}
    {% if sso_on %}
    <a class="btn primary" href="/auth/start?next={{ next|urlencode }}">Sign in with {{ sso_name }}</a>
    {% if password_on %}<p class="or">or with a password</p>{% endif %}
    {% endif %}
    {% if password_on %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username" {% if not sso_on %}autofocus{% endif %} required>
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required>
    {% if code_on %}
    <label for="c">Code from your authenticator app</label>
    <input id="c" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6 digits, if your account has one">
    {% endif %}
    <button class="btn{% if not sso_on %} primary{% endif %}" type="submit">Sign in</button>
    {% endif %}
    <p style="margin-top:14px; font-size:.86rem;"><a href="/security">Security and data handling</a></p>
  </form>
</main>
</body>
</html>
